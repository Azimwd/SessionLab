name: Verify SessionLab
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: sessionlab, POSTGRES_PASSWORD: test, POSTGRES_DB: sessionlab}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sessionlab:test@localhost:5432/sessionlab
      COOKIE_SECURE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.lock.txt
      - run: python manage.py migrate && python manage.py seed_initial_data && python -m pytest -q
        working-directory: backend
      - run: python backend/manage.py spectacular --file openapi.yaml --validate
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm test && npm run build
        working-directory: frontend
