      summary: Committed room changes via Server-Sent Events
      description: 'Authenticated campaign members only. Events: change with {revision},
        revoked with {}. No private game content is streamed. Re-fetch scoped REST
        resources after change. Heartbeat every second; reconnect after the bounded
        stream ends.'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: header
        name: Last-Event-ID
        required: false
        schema:
          type: integer
      security:
      - SessionCookie: []
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        '403':
          description: Session expired or campaign access denied
  /api/integrations/dmhub/events/:
    get:
      operationId: dmhub_bridge_events
      summary: Saved public room rolls for a campaign's DMHub bridge
      description: Read-only. Dedicated DMHub bearer token, rotated or revoked by
        campaign DM. No session cookie or CSRF. cursor=latest initializes from now;
        numeric cursor pages up to 50 committed public roll/ability events. Never
        returns hidden events or raw payloads.
      security:
      - DMHubBridgeToken: []
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
        required: false
      responses:
        '200':
          description: 'JSON envelope: data.events [{id,session,text}], data.cursor'
        '401':
          description: Missing, revoked or invalid bearer token
