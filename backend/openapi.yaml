openapi: 3.0.3
info:
  title: SessionLab API
  version: 1.0.0
  description: Server-authoritative campaign tools. Unsafe requests require CSRF.
    Game mutations require Idempotency-Key. All responses use {data,error}.
paths:
  /api/abilities/{id}/:
    patch:
      operationId: abilities_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: campaign
        required: true
        schema:
          type: integer
        description: Campaign ID, membership checked server-side.
      - in: header
        name: X-CSRFToken
        required: true
        schema:
          type: string
        description: Masked token from GET /api/auth/csrf/.
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 100
        description: Reuse the same key and payload after network failure; a different
          payload is rejected.
      tags:
      - abilities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAbilityUpdateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAbilityUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAbilityUpdateRequestRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/Ability'
                  error:
                    nullable: true
          description: ''
