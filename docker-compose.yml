services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sessionlab}
      POSTGRES_USER: ${POSTGRES_USER:-sessionlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sessionlab-local-only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.compose
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    volumes: [staticfiles:/app/staticfiles]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 5
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.compose
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [backend]
    volumes: [staticfiles:/app/staticfiles:ro]
volumes:
  pgdata:
  staticfiles:
