services:
  backend:
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_DEBUG: "1"
      COOKIE_SECURE: "0"
    ports: ["8000:8000"]
    volumes: [./backend:/app]
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --port 5173"
    environment:
      API_PROXY: http://backend:8000
    ports: ["5173:5173"]
    volumes: [./frontend:/app, frontend_node_modules:/app/node_modules]
    depends_on: [backend]
volumes:
  frontend_node_modules:
